<svg xmlns="http://www.w3.org/2000/svg" width="880" height="372" viewBox="0 0 880 372" role="img" aria-label="网格里的三台设备：laptop 运行 swarm mesh invite，显示配对码 K7QM-4ZX2；gpu 用这个码加入，并和每个成员配对；常开的 ovh 服务器作为节点服务运行。设备能直连就直连，否则走中继。">
<title>网格里的三台设备：laptop 运行 swarm mesh invite，显示配对码 K7QM-4ZX2；gpu 用这个码加入，并和每个成员配对；常开的 ovh 服务器作为节点服务运行。设备能直连就直连，否则走中继。</title>
<rect width="880" height="372" rx="12" fill="#17191c"/>
<g fill="none" stroke="#5a5e64" stroke-width="1.5" stroke-linecap="round">
<path d="M358 74 H522"/>
<path d="M193 120 L360 212"/>
<path d="M687 120 L520 212" stroke-dasharray="5 5"/>
</g>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
<text x="440" y="64" font-size="12" fill="#919191" text-anchor="middle">直连</text>
<text x="274" y="174" font-size="12" fill="#919191" text-anchor="end">直连</text>
<rect x="573" y="153" width="60" height="26" rx="13" fill="#17191c" stroke="#5a5e64" stroke-width="1.5"/>
<text x="603" y="170" font-size="12" fill="#919191" text-anchor="middle">中继</text>
<rect x="28" y="28" width="330" height="92" rx="8" fill="#1f2226" stroke="#34383e"/>
<text xml:space="preserve" x="44" y="54" fill="#e8e8e8" font-weight="700">laptop<tspan font-weight="400" fill="#919191">  笔记本</tspan></text>
<text xml:space="preserve" x="44" y="80" fill="#e8e8e8"><tspan fill="#e09758" font-weight="700">›</tspan> swarm mesh invite</text>
<text xml:space="preserve" x="44" y="104" fill="#919191">  配对码 <tspan fill="#e09758" font-weight="700">K7QM-4ZX2</tspan> · 15 分钟内有效</text>
<rect x="522" y="28" width="330" height="92" rx="8" fill="#1f2226" stroke="#34383e"/>
<text xml:space="preserve" x="538" y="54" fill="#e8e8e8" font-weight="700">gpu<tspan font-weight="400" fill="#919191">  GPU 主机</tspan></text>
<text xml:space="preserve" x="538" y="80" fill="#e8e8e8"><tspan fill="#e09758" font-weight="700">›</tspan> swarm mesh join K7QM-4ZX2</text>
<text xml:space="preserve" x="538" y="104" fill="#919191">  <tspan fill="#68d086">✓</tspan> 已和 laptop、ovh 配对</text>
<rect x="275" y="212" width="330" height="92" rx="8" fill="#1f2226" stroke="#34383e"/>
<text xml:space="preserve" x="291" y="238" fill="#e8e8e8" font-weight="700">ovh<tspan font-weight="400" fill="#919191">  常开服务器</tspan></text>
<text xml:space="preserve" x="291" y="264" fill="#e8e8e8"><tspan fill="#e09758" font-weight="700">›</tspan> swarm node install</text>
<text xml:space="preserve" x="291" y="288" fill="#919191">  <tspan fill="#68d086">✓</tspan> 作为服务常驻，接工单</text>
<g font-size="13" fill="#b4b4b4">
<text x="28" y="334">每对设备有自己的密钥，由配对码协商出来，码本身不经过网络。</text>
<text x="28" y="354">每条连接都用这把密钥做 TLS；中继只负责接通，读不到内容。</text>
</g>
</g>
</svg>
