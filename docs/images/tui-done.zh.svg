<text xml:space="preserve" x="55.6" y="436" textLength="67.2" lengthAdjust="spacingAndGlyphs" fill="#919191">sk Swarm</text>
<text xml:space="preserve" x="47.2" y="456" textLength="806.4" lengthAdjust="spacingAndGlyphs" fill="#919191">12 calls today                                                                            ? keys</text>
